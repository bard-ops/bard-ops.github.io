<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bard College Operational Status</title>
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --green-bg: #f0fdf4;
            --green-border: #22c55e;
            --green-text: #166534;
            --yellow-bg: #fefce8;
            --yellow-border: #eab308;
            --yellow-text: #854d0e;
            --red-bg: #fef2f2;
            --red-border: #ef4444;
            --red-text: #991b1b;
            --maint-bg: #f1f5f9;
            --maint-border: #64748b;
            --maint-text: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 780px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border);
        }

        header img {
            height: 56px;
            width: auto;
        }

        header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        header p {
            color: var(--muted);
            font-size: 0.95rem;
        }

        h2 {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: var(--text);
        }

        /* Top Status & Active Incidents */
        #top-status {
            margin-bottom: 2.25rem;
        }

        .banner-ok {
            background: var(--green-bg);
            border-left: 4px solid var(--green-border);
            color: var(--green-text);
            padding: 1rem 1.25rem;
            border-radius: 6px;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .banner-ok:last-child {
            margin-bottom: 0;
        }

        .incident-card {
            background: var(--red-bg);
            border-left: 4px solid var(--red-border);
            padding: 1.15rem 1.25rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        .incident-card.degraded {
            background: var(--yellow-bg);
            border-left-color: var(--yellow-border);
        }

        .incident-card.maintenance {
            background: var(--maint-bg);
            border-left-color: var(--maint-border);
        }

        .incident-card:last-child {
            margin-bottom: 0;
        }

        .incident-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--red-text);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .incident-card.degraded .incident-title {
            color: var(--yellow-text);
        }

        .incident-card.maintenance .incident-title {
            color: var(--maint-text);
        }

        .window-badge {
            display: inline-block;
            margin-top: 0.5rem;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            color: var(--maint-text);
            font-size: 0.825rem;
            font-weight: 600;
            padding: 0.25rem 0.65rem;
            border-radius: 4px;
        }

        .incident-body {
            margin-top: 0.6rem;
            white-space: pre-wrap;
            font-size: 0.95rem;
        }

        .incident-meta {
            margin-top: 0.75rem;
            font-size: 0.8rem;
            color: var(--muted);
        }

        /* Category Groups */
        .group-section {
            margin-bottom: 2rem;
        }

        .card-list {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
        }

        .system-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.85rem 1.25rem;
            border-bottom: 1px solid var(--border);
        }

        .system-row:last-child {
            border-bottom: none;
        }

        .system-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 500;
        }

        /* Status Checkbox Badge */
        .status-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 5px;
            font-size: 0.75rem;
            font-weight: 800;
            color: #ffffff;
            flex-shrink: 0;
            background-color: var(--green-border);
        }

        .status-box.degraded {
            background-color: var(--yellow-border);
        }

        .status-box.outage {
            background-color: var(--red-border);
        }

        .status-box.maintenance {
            background-color: var(--maint-border);
        }

        .status-text {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--green-text);
        }

        .status-text.degraded {
            color: var(--yellow-text);
        }

        .status-text.outage {
            color: var(--red-text);
        }

        .status-text.maintenance {
            color: var(--maint-text);
        }

        /* History */
        .history-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem 1.25rem;
            margin-bottom: 0.85rem;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .history-title {
            font-weight: 700;
            font-size: 1rem;
        }

        .history-date {
            font-size: 0.8rem;
            color: var(--muted);
        }

        .tags {
            margin: 0.5rem 0;
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .tag {
            background: #ffffff;
            color: #334155;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.15rem 0.55rem;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
        }

        .history-card .tag {
            background: #f1f5f9;
            border-color: var(--border);
        }

        .history-body {
            font-size: 0.9rem;
            color: #334155;
            white-space: pre-wrap;
            margin-top: 0.4rem;
        }

        .empty-state {
            color: var(--muted);
            font-style: italic;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <img src="assets/bard-college-logo.png" alt="Bard College" onerror="this.style.display='none'">
            <div>
                <h1>Bard College Operational Status</h1>
                <p>Out-of-band status for IT and Physical Plant infrastructure</p>
            </div>
        </header>

        <section id="top-status">
            <div class="banner-ok">All systems are operational.</div>
        </section>

        <section id="categories"></section>

        <section>
            <h2>Incident &amp; Maintenance History</h2>
            <div id="history">
                <p class="empty-state">No past incidents or maintenance recorded.</p>
            </div>
        </section>
    </div>

    <script>
        const categoryGroups = [
            {
                heading: "Information Technology",
                items: [
                    { name: "Network", label: "Network", checkboxText: "IT: Network" },
                    { name: "Systems", label: "Systems", checkboxText: "IT: Systems" },
                    { name: "Authentication", label: "Authentication", checkboxText: "IT: Authentication" },
                    { name: "Google Workspace", label: "Google Workspace", checkboxText: "IT: Google Workspace" },
                    { name: "Banner", label: "Banner", checkboxText: "IT: Banner" },
                    { name: "Other", label: "IT: Other", checkboxText: "IT: Other" }
                ]
            },
            {
                heading: "Physical plant",
                items: [
                    { name: "Power", label: "Power", checkboxText: "Physical Plant: Power" },
                    { name: "Water", label: "Water", checkboxText: "Physical Plant: Water" },
                    { name: "Weather", label: "Weather", checkboxText: "Physical Plant: Weather" },
                    { name: "Other", label: "Physical: Other", checkboxText: "Physical Plant: Other" }
                ]
            }
        ];

        const allCategoryItems = categoryGroups.flatMap(g => g.items);

        function escapeHtml(str) {
            if (!str) return "";
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        // Parses GitHub Issue Form markdown: extracts checked categories, maintenance window, and clean body text
        function parseIssueData(issue) {
            const rawBody = issue.body || "";
            const lines = rawBody.split(/\r?\n/);
            const effectiveLabels = new Set(issue.labels.map(l => l.name));

            let windowText = null;
            let section = null;
            const windowLines = [];
            const detailLines = [];

            for (const line of lines) {
                const trimmed = line.trim();

                // Detect checked boxes like "- [x] IT: Systems" and map to category label
                const checkedMatch = trimmed.match(/^- \[[xX]\]\s*(.+)$/);
                if (checkedMatch) {
                    const checkedText = checkedMatch[1].trim();
                    const matchedItem = allCategoryItems.find(
                        item => item.checkboxText.toLowerCase() === checkedText.toLowerCase() ||
                                item.label.toLowerCase() === checkedText.toLowerCase()
                    );
                    if (matchedItem) {
                        effectiveLabels.add(matchedItem.label);
                    }
                    continue;
                }

                // Skip unchecked boxes like "- [ ] IT: Network"
                if (/^- \[ \]\s*.+$/.test(trimmed)) {
                    continue;
                }

                // Track Issue Form markdown section headings
                if (/^###\s+Affected Categories/i.test(trimmed)) {
                    section = "categories";
                    continue;
                }
                if (/^###\s+Maintenance Window/i.test(trimmed)) {
                    section = "window";
                    continue;
                }
                if (/^###\s+(Status Details & Impact|Maintenance Details)/i.test(trimmed)) {
                    section = "details";
                    continue;
                }

                // Also catch inline "Maintenance Window: ..." if typed manually
                const inlineWindow = trimmed.match(/^Maintenance Window:\s*(.+)$/i);
                if (inlineWindow && !windowText) {
                    windowText = inlineWindow[1].trim();
                    continue;
                }

                if (section === "categories") {
                    continue;
                } else if (section === "window") {
                    if (trimmed && trimmed !== "_No response_") {
                        windowLines.push(trimmed);
                    }
                } else {
                    if (trimmed !== "_No response_") {
                        detailLines.push(line);
                    }
                }
            }

            if (!windowText && windowLines.length > 0) {
                windowText = windowLines.join(" ");
            }

            return {
                labels: Array.from(effectiveLabels),
                windowText,
                cleanBody: detailLines.join("\n").trim()
            };
        }

        function renderCategories(parsedOpenIssues) {
            const catDiv = document.getElementById("categories");
            catDiv.innerHTML = categoryGroups.map(group => {
                const rowsHtml = group.items.map(item => {
                    // Priority: outage (3) > degraded (2) > maintenance (1) > operational (0)
                    let severity = 0;

                    parsedOpenIssues.forEach(({ labels }) => {
                        if (labels.includes(item.label)) {
                            if (labels.includes("Outage")) {
                                severity = Math.max(severity, 3);
                            } else if (labels.includes("Degraded")) {
                                severity = Math.max(severity, 2);
                            } else if (labels.includes("Maintenance")) {
                                severity = Math.max(severity, 1);
                            } else {
                                severity = Math.max(severity, 2);
                            }
                        }
                    });

                    let state = "operational";
                    let icon = "✓";
                    let labelText = "Operational";

                    if (severity === 3) {
                        state = "outage";
                        icon = "✕";
                        labelText = "Outage";
                    } else if (severity === 2) {
                        state = "degraded";
                        icon = "!";
                        labelText = "Degraded";
                    } else if (severity === 1) {
                        state = "maintenance";
                        icon = "🔧";
                        labelText = "Maintenance";
                    }

                    const boxClass = state === "operational" ? "status-box" : `status-box ${state}`;
                    const textClass = state === "operational" ? "status-text" : `status-text ${state}`;

                    return `
                        <div class="system-row">
                            <div class="system-left">
                                <span class="${boxClass}" aria-hidden="true">${icon}</span>
                                <span>${escapeHtml(item.name)}</span>
                            </div>
                            <span class="${textClass}">${labelText}</span>
                        </div>
                    `;
                }).join("");

                return `
                    <div class="group-section">
                        <h2>${escapeHtml(group.heading)}</h2>
                        <div class="card-list">${rowsHtml}</div>
                    </div>
                `;
            }).join("");
        }

        function renderDashboard(issues) {
            const cleanIssues = issues.filter(i => !i.pull_request);
            const openParsed = cleanIssues
                .filter(i => i.state === "open")
                .map(issue => ({ issue, ...parseIssueData(issue) }));
            const closedParsed = cleanIssues
                .filter(i => i.state === "closed")
                .map(issue => ({ issue, ...parseIssueData(issue) }));

            const activeIncidents = [];
            const maintenanceItems = [];

            openParsed.forEach(item => {
                if (item.labels.includes("Maintenance") && !item.labels.includes("Outage") && !item.labels.includes("Degraded")) {
                    maintenanceItems.push(item);
                } else {
                    activeIncidents.push(item);
                }
            });

            // 1. Top Status Section
            const topDiv = document.getElementById("top-status");
            let topHtml = "";

            if (activeIncidents.length === 0) {
                topHtml += `<div class="banner-ok">All systems are operational.</div>`;
            } else {
                topHtml += activeIncidents.map(({ issue, labels, cleanBody }) => {
                    const isOutage = labels.includes("Outage");
                    const cardClass = isOutage ? "incident-card" : "incident-card degraded";
                    const tagsHtml = labels.map(l => `<span class="tag">${escapeHtml(l)}</span>`).join("");

                    return `
                        <div class="${cardClass}">
                            <div class="incident-title">${escapeHtml(issue.title)}</div>
                            <div class="tags">${tagsHtml}</div>
                            <div class="incident-body">${escapeHtml(cleanBody)}</div>
                            <div class="incident-meta">Last updated: ${new Date(issue.updated_at).toLocaleString()}</div>
                        </div>
                    `;
                }).join("");
            }

            if (maintenanceItems.length > 0) {
                topHtml += maintenanceItems.map(({ issue, labels, windowText, cleanBody }) => {
                    const tagsHtml = labels.map(l => `<span class="tag">${escapeHtml(l)}</span>`).join("");
                    const windowHtml = windowText
                        ? `<div class="window-badge">Scheduled Window: ${escapeHtml(windowText)}</div>`
                        : "";

                    return `
                        <div class="incident-card maintenance">
                            <div class="incident-title"><span aria-hidden="true">🔧</span> ${escapeHtml(issue.title)}</div>
                            ${windowHtml}
                            <div class="tags">${tagsHtml}</div>
                            <div class="incident-body">${escapeHtml(cleanBody)}</div>
                            <div class="incident-meta">Posted: ${new Date(issue.updated_at).toLocaleString()}</div>
                        </div>
                    `;
                }).join("");
            }

            topDiv.innerHTML = topHtml;

            // 2. Category Rows
            renderCategories(openParsed);

            // 3. Incident & Maintenance History
            const historyDiv = document.getElementById("history");
            if (closedParsed.length === 0) {
                historyDiv.innerHTML = `<p class="empty-state">No past incidents or maintenance recorded.</p>`;
            } else {
                historyDiv.innerHTML = closedParsed.map(({ issue, labels, windowText, cleanBody }) => {
                    const tagsHtml = labels
                        .map(l => `<span class="tag">${escapeHtml(l)}</span>`)
                        .join("");
                    const windowLine = windowText ? `Scheduled Window: ${windowText}\n\n` : "";

                    return `
                        <div class="history-card">
                            <div class="history-header">
                                <span class="history-title">${escapeHtml(issue.title)}</span>
                                <span class="history-date">Resolved ${new Date(issue.closed_at).toLocaleString()}</span>
                            </div>
                            <div class="tags">${tagsHtml}</div>
                            <div class="history-body">${escapeHtml(windowLine + cleanBody)}</div>
                        </div>
                    `;
                }).join("");
            }
        }

        // Draw all categories with green checkboxes immediately on load
        renderCategories([]);

        // Fetch live data and update if available
        fetch("data.json?t=" + Date.now())
            .then(res => {
                if (!res.ok) throw new Error("No data file yet");
                return res.json();
            })
            .then(renderDashboard)
            .catch(() => {});
    </script>
</body>
</html>
