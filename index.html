<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bard College Operational Status</title>
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --accent: #990000;
            --green-bg: #f0fdf4;
            --green-border: #22c55e;
            --green-text: #166534;
            --yellow-bg: #fefce8;
            --yellow-border: #eab308;
            --yellow-text: #854d0e;
            --red-bg: #fef2f2;
            --red-border: #ef4444;
            --red-text: #991b1b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 780px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border);
        }

        header img {
            height: 56px;
            width: auto;
        }

        header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        header p {
            color: var(--muted);
            font-size: 0.95rem;
        }

        h2 {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: var(--text);
        }

        /* Active Incidents Banner */
        #active-incidents {
            margin-bottom: 2.25rem;
        }

        .banner-ok {
            background: var(--green-bg);
            border-left: 4px solid var(--green-border);
            color: var(--green-text);
            padding: 1rem 1.25rem;
            border-radius: 6px;
            font-weight: 600;
        }

        .incident-card {
            background: var(--red-bg);
            border-left: 4px solid var(--red-border);
            padding: 1.15rem 1.25rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        .incident-card.degraded {
            background: var(--yellow-bg);
            border-left-color: var(--yellow-border);
        }

        .incident-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--red-text);
        }

        .incident-card.degraded .incident-title {
            color: var(--yellow-text);
        }

        .incident-body {
            margin-top: 0.5rem;
            white-space: pre-wrap;
            font-size: 0.95rem;
        }

        .incident-meta {
            margin-top: 0.75rem;
            font-size: 0.8rem;
            color: var(--muted);
        }

        /* Category Groups */
        .group-section {
            margin-bottom: 2rem;
        }

        .card-list {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
        }

        .system-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.85rem 1.25rem;
            border-bottom: 1px solid var(--border);
        }

        .system-row:last-child {
            border-bottom: none;
        }

        .system-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 500;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
            background-color: var(--green-border);
        }

        .status-dot.degraded {
            background-color: var(--yellow-border);
        }

        .status-dot.outage {
            background-color: var(--red-border);
        }

        .status-text {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--green-text);
        }

        .status-text.degraded {
            color: var(--yellow-text);
        }

        .status-text.outage {
            color: var(--red-text);
        }

        /* History */
        .history-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem 1.25rem;
            margin-bottom: 0.85rem;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .history-title {
            font-weight: 700;
            font-size: 1rem;
        }

        .history-date {
            font-size: 0.8rem;
            color: var(--muted);
        }

        .tags {
            margin: 0.5rem 0;
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .tag {
            background: #f1f5f9;
            color: #334155;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.15rem 0.55rem;
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        .history-body {
            font-size: 0.9rem;
            color: #334155;
            white-space: pre-wrap;
            margin-top: 0.4rem;
        }

        .empty-state {
            color: var(--muted);
            font-style: italic;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <img src="logo.png" alt="Bard College" onerror="this.style.display='none'">
            <div>
                <h1>Bard College Operational Status</h1>
                <p>Out-of-band status for IT and Physical Plant infrastructure</p>
            </div>
        </header>

        <section id="active-incidents"></section>

        <section id="categories"></section>

        <section>
            <h2>Incident History</h2>
            <div id="history"></div>
        </section>
    </div>

    <script>
        // Each item has a display name and the exact GitHub label that triggers it
        const categoryGroups = [
            {
                heading: "Information Technology",
                items: [
                    { name: "Network", label: "Network" },
                    { name: "Systems", label: "Systems" },
                    { name: "Authentication", label: "Authentication" },
                    { name: "Google Workspace", label: "Google Workspace" },
                    { name: "Banner", label: "Banner" },
                    { name: "Other", label: "IT: Other" }
                ]
            },
            {
                heading: "Physical plant",
                items: [
                    { name: "Power", label: "Power" },
                    { name: "Water", label: "Water" },
                    { name: "Weather", label: "Weather" },
                    { name: "Other", label: "Physical: Other" }
                ]
            }
        ];

        function escapeHtml(str) {
            if (!str) return "";
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function renderDashboard(issues) {
            const cleanIssues = issues.filter(i => !i.pull_request);
            const open = cleanIssues.filter(i => i.state === "open");
            const closed = cleanIssues.filter(i => i.state === "closed");

            // 1. Active Incidents at top
            const activeDiv = document.getElementById("active-incidents");
            if (open.length === 0) {
                activeDiv.innerHTML = `<div class="banner-ok">All systems are operational.</div>`;
            } else {
                activeDiv.innerHTML = open.map(issue => {
                    const labels = issue.labels.map(l => l.name);
                    const isDegradedOnly = labels.includes("Degraded") && !labels.includes("Outage");
                    const cardClass = isDegradedOnly ? "incident-card degraded" : "incident-card";
                    const tagsHtml = labels.map(l => `<span class="tag">${escapeHtml(l)}</span>`).join("");

                    return `
                        <div class="${cardClass}">
                            <div class="incident-title">${escapeHtml(issue.title)}</div>
                            <div class="tags">${tagsHtml}</div>
                            <div class="incident-body">${escapeHtml(issue.body)}</div>
                            <div class="incident-meta">Last updated: ${new Date(issue.updated_at).toLocaleString()}</div>
                        </div>
                    `;
                }).join("");
            }

            // 2. Category Sections with left-side green/yellow/red indicator
            const catDiv = document.getElementById("categories");
            catDiv.innerHTML = categoryGroups.map(group => {
                const rowsHtml = group.items.map(item => {
                    let state = "operational";
                    let labelText = "Operational";

                    open.forEach(issue => {
                        const labels = issue.labels.map(l => l.name);
                        if (labels.includes(item.label)) {
                            if (labels.includes("Outage")) {
                                state = "outage";
                                labelText = "Outage";
                            } else if (labels.includes("Degraded") && state !== "outage") {
                                state = "degraded";
                                labelText = "Degraded";
                            }
                        }
                    });

                    const dotClass = state === "operational" ? "status-dot" : `status-dot ${state}`;
                    const textClass = state === "operational" ? "status-text" : `status-text ${state}`;

                    return `
                        <div class="system-row">
                            <div class="system-left">
                                <span class="${dotClass}" aria-hidden="true"></span>
                                <span>${escapeHtml(item.name)}</span>
                            </div>
                            <span class="${textClass}">${labelText}</span>
                        </div>
                    `;
                }).join("");

                return `
                    <div class="group-section">
                        <h2>${escapeHtml(group.heading)}</h2>
                        <div class="card-list">${rowsHtml}</div>
                    </div>
                `;
            }).join("");

            // 3. Incident History
            const historyDiv = document.getElementById("history");
            if (closed.length === 0) {
                historyDiv.innerHTML = `<p class="empty-state">No past incidents recorded.</p>`;
            } else {
                historyDiv.innerHTML = closed.map(issue => {
                    const tagsHtml = issue.labels
                        .map(l => `<span class="tag">${escapeHtml(l.name)}</span>`)
                        .join("");

                    return `
                        <div class="history-card">
                            <div class="history-header">
                                <span class="history-title">${escapeHtml(issue.title)}</span>
                                <span class="history-date">Resolved ${new Date(issue.closed_at).toLocaleString()}</span>
                            </div>
                            <div class="tags">${tagsHtml}</div>
                            <div class="history-body">${escapeHtml(issue.body)}</div>
                        </div>
                    `;
                }).join("");
            }
        }

        // Cache-busting query string ensures browsers don't serve stale data.json during an outage
        fetch("data.json?t=" + Date.now())
            .then(res => {
                if (!res.ok) throw new Error("No data file yet");
                return res.json();
            })
            .then(renderDashboard)
            .catch(() => renderDashboard([]));
    </script>
</body>
</html>
